name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Compile check
        run: uv run python -m compileall -q trackremux

      - name: CLI smoke check
        run: uv run trackremux --version

      - name: Build sdist and wheel
        run: uv build

      - name: Verify built wheel
        run: uv run --no-project --isolated --with dist/*.whl trackremux --version
